<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JavaScript Example</title>
</head>
<body>
  <select id="mainSelect">
    <option value="1">Item 1</option>
    <option value="2">Item 2</option>
    <option value="3">Item 3</option>
  </select>
  <p id="outputText"></p>
  <button id="showSelectedBtn">Show Selected</button>

  <br><br>

  <select id="yearSelector">
    <option value="">Select Year</option>
  </select>
  <p id="yearResult"></p>

  <br><br>

  <select id="weekdaySelector">
    <option value="1">Monday</option>
    <option value="2">Tuesday</option>
    <option value="3">Wednesday</option>
    <option value="4">Thursday</option>
    <option value="5">Friday</option>
    <option value="6">Saturday</option>
    <option value="7">Sunday</option>
  </select>
  <p id="weekdayOutput"></p>

  <br><br>

  <select id="monthSelector">
    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
  </select>

  <br><br>

  <input type="number" id="itemIndexInput" min="0" placeholder="Enter item index (0-based)">
  <select id="dynamicSelect">
    <option value="1">Item 1</option>
    <option value="2">Item 2</option>
    <option value="3">Item 3</option>
    <option value="4">Item 4</option>
  </select>

  <br><br>

  <select id="workdaySelector">
    <option value="1">Monday</option>
    <option value="2">Tuesday</option>
    <option value="3">Wednesday</option>
    <option value="4">Thursday</option>
    <option value="5">Friday</option>
    <option value="6">Saturday</option>
    <option value="7">Sunday</option>
  </select>

  <br><br>

  <select id="fruitSelector">
    <option value="apple">Apple</option>
    <option value="banana">Banana</option>
    <option value="orange">Orange</option>
  </select>

  <br><br>

  <select id="simpleSelect">
    <option value="1">Item 1</option>
    <option value="2">Item 2</option>
    <option value="3">Item 3</option>
  </select>

  <br><br>

  <select id="positionSelect">
    <option value="1">First</option>
    <option value="2">Second</option>
    <option value="3">Third</option>
    <option value="4">Fourth</option>
  </select>
  <button id="selectLastBtn">Select Last</button>

  <br><br>

  <select id="textSelect">
    <option value="1">First item</option>
    <option value="2">Second item</option>
    <option value="3">Third item</option>
  </select>
  <button id="showTextBtn">Show Text</button>
  <p id="selectedItemText"></p>

  <br><br>

  <select id="modifiableSelect">
    <option value="1">Item 1</option>
    <option value="2">Item 2</option>
    <option value="3">Item 3</option>
  </select>
  <button id="addExclamationBtn">Add !</button>

  <script src="Выпадающие списки.js"></script>
</body>
</html>
